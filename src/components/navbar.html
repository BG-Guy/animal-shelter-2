    <header id="site-header" class="sticky top-0 z-30 transition-shadow">
      <!-- Separate layer for the frosted-glass background: backdrop-blur on the
           header itself would create a new containing block, trapping the
           fixed-position mobile nav drawer inside the header's bounding box
           instead of the viewport. -->
      <div class="absolute inset-0 -z-10 bg-brand-bg/90 backdrop-blur"></div>
      <nav class="relative container max-w-container flex items-center justify-between py-4">
        <a href="#top" class="font-heading text-2xl text-brand-text">Furever Home 🐾</a>

        <button
          id="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-menu"
          class="sm:hidden w-10 h-10 flex items-center justify-center rounded-full border border-brand-border"
        >
          <span class="sr-only">Toggle menu</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <div
          id="nav-backdrop"
          class="sm:hidden fixed inset-0 z-40 bg-black/50 opacity-0 pointer-events-none transition-opacity duration-300"
        ></div>

        <div
          id="nav-menu"
          aria-hidden="true"
          class="fixed sm:static top-0 right-0 z-50 h-full sm:h-auto w-72 max-w-[80%] sm:w-auto translate-x-full sm:translate-x-0 flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-8 bg-brand-bg sm:bg-transparent shadow-soft sm:shadow-none px-6 sm:px-0 pt-20 sm:pt-0 pb-6 font-semibold text-sm transition-transform duration-300 ease-out"
        >
          <button
            id="nav-close"
            type="button"
            class="sm:hidden absolute top-4 right-4 w-10 h-10 flex items-center justify-center rounded-full border border-brand-border"
          >
            <span class="sr-only">Close menu</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
          <a href="#pets" class="py-2 sm:py-0 hover:text-brand-secondary transition">Adopt</a>
          <a href="#how-it-works" class="py-2 sm:py-0 hover:text-brand-secondary transition">How it works</a>
          <a href="#about" class="py-2 sm:py-0 hover:text-brand-secondary transition">About</a>
          <a href="#get-involved" class="py-2 sm:py-0 hover:text-brand-secondary transition">Get involved</a>
        </div>
      </nav>
    </header>
